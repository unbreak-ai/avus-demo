        font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#070810;color:#f4f1ea}

      #avus-fallback h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
      #avus-fallback p{font-size:14px;line-height:1.6;margin:0 0 12px;opacity:.8}
      #avus-fallback b{font-weight:700;opacity:1}
