<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070810" />

    <title>AVUS — Unbreak AI</title>
    <style>
      /* Shown only if the app could not start — e.g. this file is being previewed
         inside Google Drive, Gmail or a chat app, which block scripts. Hidden the

        font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#070810;color:#f4f1ea}
      @media (prefers-color-scheme:light){#avus-fallback{background:#f1eee6;color:#0a0d16}}

      #avus-fallback .card{max-width:420px;width:100%;border-radius:18px;padding:28px;background:rgba(127,127,127,.08);border:1px solid rgba(127,127,127,.2)}
      #avus-fallback .eyebrow{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#e9d2a8;margin:0 0 12px}
      #avus-fallback h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
      #avus-fallback p{font-size:14px;line-height:1.6;margin:0 0 12px;opacity:.8}
      #avus-fallback b{font-weight:700;opacity:1}
    </style>
